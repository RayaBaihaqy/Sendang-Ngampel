<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140" fill="none">
  <!-- Batik Kawung & Parang Heritage Motif -->
  <g opacity="0.9">
    <!-- Outer Petals -->
    <ellipse cx="70" cy="35" rx="30" ry="18" fill="none" stroke="#C29B38" stroke-width="2.2" />
    <ellipse cx="70" cy="105" rx="30" ry="18" fill="none" stroke="#C29B38" stroke-width="2.2" />
    <ellipse cx="35" cy="70" rx="18" ry="30" fill="none" stroke="#C29B38" stroke-width="2.2" />
    <ellipse cx="105" cy="70" rx="18" ry="30" fill="none" stroke="#C29B38" stroke-width="2.2" />

    <!-- Corner Petals -->
    <ellipse cx="0" cy="0" rx="30" ry="18" transform="rotate(45 0 0)" fill="none" stroke="#C29B38" stroke-width="2.2" />
    <ellipse cx="140" cy="0" rx="30" ry="18" transform="rotate(-45 140 0)" fill="none" stroke="#C29B38" stroke-width="2.2" />
    <ellipse cx="0" cy="140" rx="30" ry="18" transform="rotate(-45 0 140)" fill="none" stroke="#C29B38" stroke-width="2.2" />
    <ellipse cx="140" cy="140" rx="30" ry="18" transform="rotate(45 140 140)" fill="none" stroke="#C29B38" stroke-width="2.2" />

    <!-- Inner Contour Accent -->
    <ellipse cx="70" cy="35" rx="18" ry="10" fill="none" stroke="#8A674F" stroke-width="1.5" />
    <ellipse cx="70" cy="105" rx="18" ry="10" fill="none" stroke="#8A674F" stroke-width="1.5" />
    <ellipse cx="35" cy="70" rx="10" ry="18" fill="none" stroke="#8A674F" stroke-width="1.5" />
    <ellipse cx="105" cy="70" rx="10" ry="18" fill="none" stroke="#8A674F" stroke-width="1.5" />

    <!-- Center Ornament Star -->
    <polygon points="70,54 84,70 70,86 56,70" fill="#C29B38" opacity="0.9" />
    <circle cx="70" cy="70" r="5" fill="#5A3A28" />
    <circle cx="70" cy="70" r="2.5" fill="#F8F2E7" />

    <!-- Corner Stars -->
    <circle cx="0" cy="0" r="5" fill="#C29B38" />
    <circle cx="140" cy="0" r="5" fill="#C29B38" />
    <circle cx="0" cy="140" r="5" fill="#C29B38" />
    <circle cx="140" cy="140" r="5" fill="#C29B38" />

    <!-- Inner Dots -->
    <circle cx="70" cy="35" r="3" fill="#C29B38" />
    <circle cx="70" cy="105" r="3" fill="#C29B38" />
    <circle cx="35" cy="70" r="3" fill="#C29B38" />
    <circle cx="105" cy="70" r="3" fill="#C29B38" />
  </g>
</svg>
