<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <!-- Midground silhouettes: Banyan tree branches, heritage gate pillars, spring pool line -->
  <g fill="#2A1B14" opacity="0.95">
    <!-- Left Heritage Banyan Silhouettes -->
    <path d="M-50 0 C150 100, 200 400, 250 800 C180 850, 100 950, -50 1080 Z"/>
    <path d="M120 0 C220 200, 300 350, 180 500 C100 350, 50 200, 120 0 Z"/>
    
    <!-- Right Heritage Tree Silhouettes -->
    <path d="M1970 0 C1770 120, 1720 450, 1680 820 C1750 880, 1850 980, 1970 1080 Z"/>
    
    <!-- Central Heritage Stone Gate / Archway Outline -->
    <path d="M600 900 L600 650 Q 960 550, 1320 650 L1320 900 L1250 900 L1250 680 Q 960 590, 670 680 L670 900 Z" stroke="#3B261B" stroke-width="8"/>
    
    <!-- Distant water pool horizon -->
    <path d="M0 800 Q 960 780, 1920 800 L1920 1080 L0 1080 Z" fill="#1C110C"/>
  </g>
</svg>
